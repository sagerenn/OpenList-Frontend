name: Format

on:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    # Skip in forks that haven't configured the BOT_TOKEN secret — without it
    # actions/checkout fails with "Input required and not supplied: token".
    if: ${{ secrets.BOT_TOKEN != '' }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_TOKEN }}
      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install

      - name: Format
        run: pnpm run format

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit and push formatting changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip ci] style: format code with prettier"
          commit_author: "${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>"
          commit_user_name: ${{ steps.import-gpg.outputs.name }}
          commit_user_email: ${{ steps.import-gpg.outputs.email }}

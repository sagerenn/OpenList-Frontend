<!doctype html>
<html lang="en" translate="no">

    <!-- customize head -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="generator" content="OpenList" />
    <meta name="theme-color" content="#000000" />
    <meta name="google" content="notranslate" />
    <link href="/manifest.json" rel="manifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenList" />
    <link rel="apple-touch-icon" href="https://res.oplist.org/logo/logo.png" />
    <link
      rel="shortcut icon"
      type="image/ico"
      href="https://res.oplist.org/logo/logo.svg"
    />
    <title>Loading...</title>
    <script>
      window.OPENLIST_CONFIG = {
        cdn: undefined,
        base_path: undefined,
        api: undefined,
        main_color: undefined,
      }
      window.__dynamic_base__ = window.OPENLIST_CONFIG.cdn || ""
    </script>
    <script>
      // Subpath guard: if the app is configured for a base path but got
      // served at a URL outside it (e.g. the visitor hit the host root
      // directly while the backend re-prefixes "/" for reverse proxies
      // that strip the subpath), the router's base would match no route
      // and the app would render blank. Send the browser to the same
      // path under the configured base before the bundle loads. A no-op
      // for root deployments (base_path "/" or undefined) and when the
      // URL already lives under the base.
      ;(function () {
        var bp = window.OPENLIST_CONFIG.base_path
        if (!bp) return
        if (bp !== "/" && bp.charAt(0) !== "/") bp = "/" + bp
        if (bp.length > 1 && bp.charAt(bp.length - 1) === "/")
          bp = bp.slice(0, -1)
        if (bp === "/" || bp === "") return
        var p = location.pathname
        if (p === bp || p.indexOf(bp + "/") === 0) return
        location.replace(bp + p + location.search + location.hash)
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/main.tsx" type="module"></script>
    <!-- customize body -->
  </body>
</html>
